<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals - Waypoint</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div>
            <h1>Waypoint</h1>
        </div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="goals.html">GOALS</a>
            <a href="achievements.html">ACHIEVEMENTS</a>
            <a href="certificates.html">CERTIFICATES</a>
        </nav>
    </header>

    <main>
          <h2 class="goals-section">GOALS</h2>

          <div class="task-card">
          <h3>Tasks</h3>
            <label for="Task">Enter Your tasks:</label>
            <input type="text" id="Task" placeholder="what do u need to do today......">
            <button type="button">ADD TASK</button>
          </div>

          <div class="goals-card">
          <h3>Goals</h3>
            <label for="Goal">Enter Your Goals:</label>
            <input type="text" id="Goal" placeholder="what do you want to achieve?">
            <button type="button">ADD GOAL</button>
          </div>

          <div class="milestones-card">
          <h3>Milestones</h3>
            <label for="Milestones">Enter Your Milestones:</label>
            <input type="text" id="Milestones" placeholder="what are u ultimately working towrds?">
            <button type="button">ADD MILESTONE</button> 
          </div>
    </main>
</body>
