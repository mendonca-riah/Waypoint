<!DOCTYPE html>
<html>

    <head>
        <title>Waypoint</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>

    <body>
        <header class="main-header">
        <div>
            <h1>Waypoint</h1>
        </div>
        <nav>
            <a href="#GOALS">GOALS</a>
            <a href="#ACHIEVEMENTS">ACHIEVEMENTS</a>
            <a href="#CERTIFICATES">CERTIFICATES</a>
        </nav>
        </header>
        <section id="WELCOME">
            <h1 class="welcome-title">Waypoint</h1>
            <p class="mission">Plan.Progress.Reflect.Grow</p>
            <p class="description">A place where you've been,where you are,and where you are going</p>
            <h2 class="welcome-heading">Welcome To Waypoint ......</h2>
            <p class="quote">Small steps still move you forward</p>
        </section>

        <section id="GOALS">
            <h2>GOALS</h2>

            <h3>Tasks</h3>
            <label for="Task">Enter Your tasks:</label>
            <input type="text" id="Task" placeholder="what do u need to do today......">
            <button type="button">ADD TASK</button>

            <h3>Goals</h3>
            <label for="Goal">Enter Your Goals:</label>
            <input type="text" id="Goal" placeholder="what do you want to achieve?">
            <button type="button">ADD GOAL</button>

            <h3>Milestones</h3>
            <label for="Milestones">Enter Your Milestones:</label>
            <input type="text" id="Milestones" placeholder="what are u ultimately working towrds?">
            <button type="button">ADD MILESTONE</button> 
         </section>

         <section id="ACHIEVEMENTS">
            <h2>ACHIEVEMENTS</h2>

            <h3>Wins</h3>
            <label for="Win">Record A Win</label>
            <input type="text" id="Win" placeholder="what did you accomplish.....">
            <button type="button">ADD WIN</button>

            <h3>Accomplishments</h3>
            <label for="Accomplishments">Record An Accomplishment</label>
            <input type="text" id="Accomplishments" placeholder="what did you conquer">
            <button type="button">ADD ACCOMPLISHMENT</button>
         </section>

         <section id="CERTIFICATES">
            <h2>CERTIFICATES</h2>
             
            <label for="certificate_name">Certificate Name</label>
            <input type="text" id="certificate_name" placeholder="enter certificate name">

            <label for="issued_by">Issued By</label>
            <input type="text" id="issued_by" placeholder="who issued this certificate">

            <label for="date">Date:</label>
            <input type="date" id="date">

            <label for="certificate_file">Certificate File</label>
            <input type="file" id="certificate_file">

            <button type="button">ADD CERTIFICATE</button>
         </section>

    </body>
</html>
