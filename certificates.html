<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Certificates - Waypoint</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>

        <header class="main-header">
        <div>
            <h1>Waypoint</h1>
        </div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="goals.html">GOALS</a>
            <a href="achievements.html">ACHIEVEMENTS</a>
            <a href="certificates.html" class="active">CERTIFICATES</a>
        </nav>
        </header>

        <main>
            <h2 class="certificates-section">CERTIFICATES</h2>
            
            <div class="certificates-card"> 
            <label for="certificate_name">Certificate Name</label>
            <input type="text" id="certificate_name" placeholder="enter certificate name">

            <label for="issued_by">Issued By</label>
            <input type="text" id="issued_by" placeholder="who issued this certificate">

            <label for="date">Date:</label>
            <input type="date" id="date">

            <label for="certificate_file">Certificate File</label>
            <input type="file" id="certificate_file" placeholder="choose file">

            <button type="button">ADD CERTIFICATE</button>
            </div>
         </main>



    </body>
</html>
